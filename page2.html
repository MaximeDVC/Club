<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le couloir des 7 arts</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  font-family: Georgia, serif;
  background: url('assets/img/fond-page2.png') no-repeat center center fixed;
  background-size: cover;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 2vh;
  color: #333;
}
h1 {
  margin-top: 20px;
}
.arts-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.art-button {
  background: #222;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}
.art-button:hover {
  background: #555;
}
#popup {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.popup-content {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  background-size: cover;
  background-position: center;
}
.close-btn {
  margin-top: 10px;
  cursor: pointer;
  padding: 5px 10px;
  background: #222;
  color: #fff;
  border: none;
  border-radius: 5px;
}
.mdp-section {
  margin-top: 30px;
  text-align: center;
}
.mdp-section input {
  padding: 8px;
  margin-right: 5px;
}
.mdp-section button {
  padding: 8px 15px;
  background: #222;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
.mdp-section button:hover {
  background: #555;
}
#error-message {
  color: red;
  margin-top: 10px;
}
</style>
</head>
<body>

<h1>Choisis un art à explorer</h1>

  <audio id="bg-music" autoplay loop>
  <source src="assets/audio/puzzle.mp3" type="audio/mp3">
</audio>


<div class="arts-container">
  <button class="art-button" onclick="ouvrirPopup('litterature')">📚 Littérature</button>
  <button class="art-button" onclick="ouvrirPopup('musique')">🎵 Musique</button>
  <button class="art-button" onclick="ouvrirPopup('danse')">💃 Danse</button>
  <button class="art-button" onclick="ouvrirPopup('architecture')">🏛 Architecture</button>
  <button class="art-button" onclick="ouvrirPopup('peinture')">🎨 Peinture</button>
  <button class="art-button" onclick="ouvrirPopup('sculpture')">🗿 Sculpture</button>
  <button class="art-button" onclick="ouvrirPopup('cinema')">🎬 Cinéma</button>
</div>

<div id="popup">
  <div class="popup-content" id="popup-content">
    <h2 id="titre-art"></h2>
    <p id="gps-coords"></p>
    <input type="text" id="reponse" placeholder="Votre réponse ici"><br>
    <div id="indice"></div>
    <button class="close-btn" onclick="fermerPopup()">Fermer</button>
  </div>
</div>

<div class="mdp-section">
  <h2>Mot de passe final :</h2>
  <input type="password" id="mdp-final" placeholder="Mot de passe final">
  <button onclick="verifierMdp()">Valider</button>
  <div id="error-message"></div>
</div>

<script>
const dataArts = {
  litterature: {
    titre: "Salle de la Littérature",
    gps: "48.51531, 2.34212",
    reponse: "Dupin",
    indice: "Lettre : G",
    fond : "assets/img/salle-litterature.png",
  },
  musique: {
    titre: "Salle de la Musique",
    gps: "48.51524, 2.34483",
    reponse: "4",
    indice: "Lettre : A",
    fond : "assets/img/salle-musique.png",
  },
  danse: {
    titre: "Salle de la Danse",
    gps: "48.52358, 2.35194",
    reponse: "Danc'Itt",
    indice: "Lettre : L",
    fond : "assets/img/salle-danse.png",
  },
  architecture: {
    titre: "Salle de l'Architecture",
    gps: "48.51497, 2.34206",
    reponse: "6",
    indice: "Lettre : E",
    fond : "assets/img/salle-architecture.png",
  },
  peinture: {
    titre: "Salle de la Peinture",
    gps: "48.51683, 2.34507",
    reponse: "Simurgh",
    indice: "Lettre : R",
    fond : "assets/img/salle-peinture.png",
  },
  sculpture: {
    titre: "Salle de la Sculpture",
    gps: "48.50783, 2.33822",
    reponse: "Hongrois",
    indice: "Lettre : I",
    fond : "assets/img/salle-sculpture.png",
  },
  cinema: {
    titre: "Salle du Cinéma",
    gps: "48.52608, 2.35247",
    reponse: "Laguionie",
    indice: "Lettre : E",
    fond : "assets/img/salle-cinema.png",
  }
};

let currentArt = "";

function ouvrirPopup(art) {
  const popup = document.getElementById("popup");
  const content = document.getElementById("popup-content");
  const titre = document.getElementById("titre-art");
  const coords = document.getElementById("gps-coords");
  const reponse = document.getElementById("reponse");
  const indice = document.getElementById("indice");

  currentArt = art;
  const data = dataArts[art];

  titre.textContent = data.titre;
  coords.textContent = `📍 : ${data.gps}`;
  reponse.value = "";
  indice.textContent = "Entre la bonne réponse pour obtenir un indice...";

  content.style.backgroundImage = `url('${data.fond}')`;
  popup.style.display = "flex";
}

function fermerPopup() {
  document.getElementById("popup").style.display = "none";
}

document.getElementById("reponse").addEventListener("input", function() {
  const saisie = this.value.trim().toLowerCase();
  const bonneReponse = dataArts[currentArt].reponse.toLowerCase();
  const indice = document.getElementById("indice");

  if (saisie === bonneReponse) {
    indice.textContent = dataArts[currentArt].indice;
  } else {
    indice.textContent = "Mauvaise réponse...";
  }
});

// Vérification du mot de passe final
function verifierMdp() {
  const mdp = document.getElementById("mdp-final").value.trim().toLowerCase();
  const attendu = "GALERIE";
  if (mdp === attendu) {
    window.location.href = "finale.html";
  } else {
    document.getElementById("error-message").textContent = "Mot de passe incorrect, essaye encore.";
  }
}
</script>
  
<script>
  window.addEventListener("click", () => {
    const audio = document.getElementById("bg-music");
    if (audio.paused) {
      audio.play().catch(() => {});
    }
  });
</script>

</body>
</html>
