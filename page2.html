<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le couloir des 7 arts</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  font-family: Georgia, serif;
  background: url('assets/img/fond-page2.png') no-repeat center center fixed;
  background-size: cover;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 2vh;
  color: #333;
}
h1 {
  margin-top: 20px;
}
.arts-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.art-button {
  background: #222;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}
.art-button:hover {
  background: #555;
}
#popup {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.popup-content {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  max-width: 400px;
  width: 90%;
  text-align: center;
}
.close-btn {
  margin-top: 10px;
  cursor: pointer;
  padding: 5px 10px;
  background: #222;
  color: #fff;
  border: none;
  border-radius: 5px;
}
</style>
</head>
<body>

<h1>Choisis un art à explorer</h1>

<div class="arts-container">
  <button class="art-button" onclick="ouvrirPopup('litterature')">📚 Littérature</button>
  <button class="art-button" onclick="ouvrirPopup('musique')">🎵 Musique</button>
  <button class="art-button" onclick="ouvrirPopup('danse')">💃 Danse</button>
  <button class="art-button" onclick="ouvrirPopup('architecture')">🏛 Architecture</button>
  <button class="art-button" onclick="ouvrirPopup('peinture')">🎨 Peinture</button>
  <button class="art-button" onclick="ouvrirPopup('sculpture')">🗿 Sculpture</button>
  <button class="art-button" onclick="ouvrirPopup('cinema')">🎬 Cinéma</button>
</div>

<div id="popup">
  <div class="popup-content" id="popup-content">
    <h2 id="titre-art"></h2>
    <p id="gps-coords"></p>
    <input type="text" id="reponse" placeholder="Votre réponse ici"><br>
    <div id="indice"></div>
    <button class="close-btn" onclick="fermerPopup()">Fermer</button>
  </div>
</div>

<script>
const dataArts = {
  litterature: {
    titre: "Salle de la Littérature",
    gps: "48.8566, 2.3522",
    reponse: "Dupin",
    indice: "Lettre : A"
  },
  musique: {
    titre: "Salle de la Musique",
    gps: "48.8570, 2.3540",
    reponse: "7",
    indice: "Lettre : R"
  },
  danse: {
    titre: "Salle de la Danse",
    gps: "48.8580, 2.3550",
    reponse: "Danc'Itt",
    indice: "Lettre : T"
  },
  architecture: {
    titre: "Salle de l'Architecture",
    gps: "48.8590, 2.3560",
    reponse: "6",
    indice: "Lettre : C"
  },
  peinture: {
    titre: "Salle de la Peinture",
    gps: "48.8600, 2.3570",
    reponse: "Simurgh",
    indice: "Lettre : P"
  },
  sculpture: {
    titre: "Salle de la Sculpture",
    gps: "48.8610, 2.3580",
    reponse: "Hongrois",
    indice: "Lettre : S"
  },
  cinema: {
    titre: "Salle du Cinéma",
    gps: "48.8620, 2.3590",
    reponse: "Laguionie",
    indice: "Lettre : I"
  }
};

let currentArt = "";

function ouvrirPopup(art) {
  const popup = document.getElementById("popup");
  const titre = document.getElementById("titre-art");
  const coords = document.getElementById("gps-coords");
  const reponse = document.getElementById("reponse");
  const indice = document.getElementById("indice");

  currentArt = art;
  const data = dataArts[art];

  titre.textContent = data.titre;
  coords.textContent = `📍 : ${data.gps}`;
  reponse.value = "";
  indice.textContent = "Entre la bonne réponse pour obtenir un indice...";

  popup.style.display = "flex";
}

function fermerPopup() {
  document.getElementById("popup").style.display = "none";
}

document.getElementById("reponse").addEventListener("input", function() {
  const saisie = this.value.trim().toLowerCase();
  const bonneReponse = dataArts[currentArt].reponse.toLowerCase();
  const indice = document.getElementById("indice");

  if (saisie === bonneReponse) {
    indice.textContent = dataArts[currentArt].indice;
  } else {
    indice.textContent = "Mauvaise réponse...";
  }
});
</script>

</body>
</html>
