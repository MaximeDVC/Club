<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Félicitations Explorateur !</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, serif;
      background: url('assets/img/fond-final.png') no-repeat center center fixed;
      background-size: cover;
      color: black;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 10vh;
      font-size: 2.5em;
      text-shadow: 2px 2px 5px #000;
      animation: fadeIn 2s ease-out;
    }

    p {
      font-size: 1.2em;
      margin: 20px;
      animation: fadeIn 3s ease-out;
    }

    form {
      margin-top: 30px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      animation: fadeIn 4s ease-out;
    }

    input {
      margin: 10px;
      padding: 10px;
      border-radius: 5px;
      border: none;
      width: 200px;
    }

    button {
      padding: 10px 20px;
      background-color: #0cf;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti {
      position: fixed;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: url('assets/img/confetti.gif');
      background-size: cover;
      opacity: 0.5;
      z-index: 0;
    }
  </style>
</head>
<body onclick="playMusic()">

  <div class="confetti"></div>

  <h1>🎉 Félicitations Explorateur ! 🎉</h1>
  <p>Tu as franchi toutes les étapes avec brio.</p>
  <p>Remplis ce formulaire pour confirmer ta victoire.</p>

  <form action="https://formspree.io/f/manbqldg" method="POST">
    <input type="text" name="Nom" placeholder="Nom" required><br>
    <input type="text" name="Prénom" placeholder="Prénom" required><br>
    <input type="number" name="Adultes" placeholder="Nombre d'adultes" required><br>
    <input type="number" name="Enfants" placeholder="Nombre d'enfants" required><br>
    <button type="submit">Envoyer</button>
  </form>

  <audio id="musique" src="assets/audio/musique-finale.mp3" loop></audio>

  <script>
    let musiqueJouee = false;
    function playMusic() {
      if (!musiqueJouee) {
        document.getElementById("musique").play();
        musiqueJouee = true;
      }
    }
  </script>

</body>
</html>
